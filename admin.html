<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro | Green Code</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #121212; color: #f5f5f5; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #1e1e1e; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { font-size: 1.8rem; text-align: center; margin-bottom: 8px; color: #00e676; }
        p.subtitle { text-align: center; font-size: 0.9rem; color: #aaa; margin-bottom: 24px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #2a2a2a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #444; font-size: 0.95rem; }
        th { background: #333; color: #00e676; font-weight: bold; }
        tr:hover { background: #323232; }
        
        .btn-acao { padding: 6px 12px; background: #ff5252; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-acao:hover { background: #ff1744; }

        .btn-atualizar { display: block; width: 100%; max-width: 200px; margin: 20px auto 0; padding: 10px; background: #00e676; color: #121212; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-atualizar:hover { background: #00c853; }
        .empty-msg { text-align: center; padding: 20px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel Administrativo</h1>
    <p class="subtitle">Agendamentos ativos (Hoje em diante)</p>

    <table>
        <thead>
            <tr>
                <th>Cliente</th>
                <th>WhatsApp</th>
                <th>Data e Horário</th>
                <th>Serviço(s)</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-agendamentos">
            <tr>
                <td colspan="5" class="empty-msg">A carregar agendamentos...</td>
            </tr>
        </tbody>
    </table>

    <button class="btn-atualizar" onclick="carregarAgendamentos()">Atualizar Lista</button>
</div>

<script>
    const SUPABASE_URL = 'https://twfpefjuwggktkyvqwhc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uxHpeu2SOxPef98adeAZMw_Hdlt9yFE';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarAgendamentos() {
        const tbody = document.getElementById('tabela-agendamentos');
        tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">A carregar agendamentos...</td></tr>';

        // Pega a data de hoje no formato ISO YYYY-MM-DD para filtrar o que já passou
        const hojeISO = new Date().toISOString().split('T')[0];

        // Busca apenas agendamentos cuja data/horário seja maior ou igual a hoje (início do dia)
        const { data, error } = await _supabase
            .from('agendamentos')
            .select('*')
            .gte('data_horario', hojeISO + 'T00:00:00')
            .order('data_horario', { ascending: true });

        if (error) {
            console.error('Erro ao carregar agendamentos:', error);
            tbody.innerHTML = `<tr><td colspan="5" class="empty-msg" style="color: #ff5252;">Erro ao carregar dados.</td></tr>`;
            return;
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhum agendamento ativo para hoje ou dias futuros.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        data.forEach(item => {
            const dataObj = new Date(item.data_horario);
            const dataFormatada = !isNaN(dataObj) ? dataObj.toLocaleString('pt-BR', { timeZone: 'UTC' }) : item.data_horario;

            let nomeServico = 'Serviço não especificado';
            if (item.servicos_lista && Array.isArray(item.servicos_lista) && item.servicos_lista.length > 0) {
                nomeServico = item.servicos_lista.join(', ');
            }

            tbody.innerHTML += `
                <tr>
                    <td>${item.cliente_nome}</td>
                    <td><a href="https://wa.me/55${item.cliente_whatsapp.replace(/\D/g,'')}" target="_blank" style="color: #00e676; text-decoration: none;">${item.cliente_whatsapp}</a></td>
                    <td>${dataFormatada}</td>
                    <td>${nomeServico}</td>
                    <td><button class="btn-acao" onclick="concluirAtendimento(${item.id})">Concluir</button></td>
                </tr>
            `;
        });
    }

    // Função para remover o agendamento da tabela quando o cliente for atendido
    async function concluirAtendimento(id) {
        if (confirm('Deseja marcar este atendimento como concluído/remover da lista?')) {
            const { error } = await _supabase
                .from('agendamentos')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Erro ao concluir: ' + error.message);
            } else {
                carregarAgendamentos(); // Atualiza a tabela na hora
            }
        }
    }

    carregarAgendamentos();
</script>

</body>
</html>
