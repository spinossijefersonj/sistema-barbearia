<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
  </defs>

  <!-- Fundo Circular Estilizado -->
  <circle cx="200" cy="200" r="190" fill="url(#bg-grad)" stroke="#333" stroke-width="6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Ícone Centralizado (Tesoura e Navalha / Estilo Barber) -->
  <g transform="translate(200, 160) scale(1.8)" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tesoura estilizada -->
    <circle cx="-12" cy="18" r="4" stroke-width="2.5"/>
    <circle cx="12" cy="18" r="4" stroke-width="2.5"/>
    <line x1="-9" y1="15" x2="12" y2="-12"/>
    <line x1="9" y1="15" x2="-12" y2="-12"/>
    <circle cx="0" cy="2" r="1.5" fill="#00e676"/>
    
    <!-- Lâmina / Navalha ao fundo -->
    <path d="M-22 -18 C -10 -25, 10 -25, 22 -18 C 15 -5, -15 -5, -22 -18 Z" fill="#00e676" opacity="0.15" stroke="none"/>
  </g>

  <!-- Texto Curvado / Inferior -->
  <text x="200" y="275" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">BARBEARIA</text>
  <text x="200" y="300" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#00e676" text-anchor="middle" letter-spacing="6">DEMO</text>
  
  <!-- Detalhe EST -->
  <text x="200" y="335" font-family="'Segoe UI', sans-serif" font-size="9" fill="#777777" text-anchor="middle" letter-spacing="2">EST. 2026</text>
</svg>
